name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject commit SHA
        env:
          SHA_FULL: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHA_FULL:0:7}"
          BUILT_AT="$(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M:%S')"
          mkdir -p dist

          # 用 perl 做字面替換，避免 / & 等字元干擾
          SHA_FULL="$SHA_FULL" SHORT="$SHORT" BUILT_AT="$BUILT_AT" perl -0pe '
            s/\{\{COMMIT_SHA\}\}/$ENV{SHA_FULL}/g;
            s/\{\{COMMIT_SHA_SHORT\}\}/$ENV{SHORT}/g;
            s/\{\{BUILD_TIME\}\}/$ENV{BUILT_AT}/g;
          ' index.html > dist/index.html

          echo "=== 替換結果 ==="
          grep -n 'name="build-' dist/index.html
          if grep -q '{{COMMIT_SHA}}' dist/index.html; then
            echo "::error::仍有未替換的 COMMIT_SHA 佔位符"; exit 1
          fi
          echo "SHA=$SHA_FULL ($SHORT) @ $BUILT_AT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
